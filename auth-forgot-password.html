<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | MediPulse</title>
  <meta name="description" content="MediPulse clinic and healthcare admin template built with Bootstrap 5.">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link id="bs-css" rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css"
        data-ltr="assets/vendor/bootstrap/bootstrap.min.css" data-rtl="assets/vendor/bootstrap/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="auth">
    <aside class="auth__aside"><a class="sidebar__brand p-0" href="index.html" style="height:auto"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i>MediPulse</a><h2>Care that runs on clear information</h2><p class="mb-0 opacity-75">Appointments, records, lab and billing in one workspace.</p></aside>
    <main class="auth__main" id="main-content">
      <button class="btn btn-link text-reset fs-5 auth__theme" type="button" data-mp-action="theme" aria-label="Toggle dark mode"><i class="bi bi-moon-stars theme-icon-light" aria-hidden="true"></i><i class="bi bi-sun theme-icon-dark" aria-hidden="true"></i></button>
      <div class="auth__box"><h1 class="h3">Reset your password</h1><p class="text-muted-mp mb-4">Enter your email and we will send a reset link.</p>
        <form class="needs-validation" novalidate action="auth-login.html"><div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" class="form-control" type="email" autocomplete="email" placeholder="name@example.com" required><div class="invalid-feedback">Enter a valid email address.</div></div><button class="btn btn-primary w-100" type="submit">Send reset link</button></form>
        <p class="text-center mt-4 mb-0"><a href="auth-login.html">Back to sign in</a></p>
      </div>
    </main>
  </div>
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
